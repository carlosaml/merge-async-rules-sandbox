name: approve
on:
  workflow_dispatch:
    inputs:
      pr:
        required: true
jobs:
  approve:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - run: gh pr review "$PR" --approve -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
